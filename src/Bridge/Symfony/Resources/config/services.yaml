services:
  _defaults:
    autowire: false
    autoconfigure: false
    public: false

  RoyaltyFusion\DianPhp\Ws\SoapClient:
    arguments:
      - '%dian.environment%'
      - null
      - null
      - '@?logger'

  RoyaltyFusion\DianPhp\Validator\BusinessRuleValidator: ~

  RoyaltyFusion\DianPhp\Report\HtmlReport:
    arguments:
      - null
      - '%dian.report.logo_url%'
      - '%dian.report.accent_color%'

  # Facade: builds CUFE/XML/signature with the right environment code and
  # injects the certificate into the SOAP client (WS-Security).
  RoyaltyFusion\DianPhp\Dian:
    public: true
    arguments:
      - '%dian.cert.path%'
      - '%dian.cert.password%'
      - '%dian.environment%'
    calls:
      - [setSoapClient, ['@RoyaltyFusion\DianPhp\Ws\SoapClient']]
      - [setValidator, ['@RoyaltyFusion\DianPhp\Validator\BusinessRuleValidator']]
      - [validateBeforeSend, ['%dian.validate_before_send%']]
      - [setProviderCode, ['%dian.software.provider_code%']]
      - [setSignerRole, ['%dian.signer_role%']]

  # Console commands
  RoyaltyFusion\DianPhp\Bridge\Symfony\Command\DianStatusCommand:
    tags: ['console.command']
    arguments:
      - '@RoyaltyFusion\DianPhp\Dian'

  RoyaltyFusion\DianPhp\Bridge\Symfony\Command\DianDoctorCommand:
    tags: ['console.command']
    arguments:
      - '%dian.cert.path%'
      - '%dian.cert.password%'
      - '%dian.environment%'
      - '%dian.software.id%'
      - '%dian.software.provider_nit%'
      - '%dian.nit%'
